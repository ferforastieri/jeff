name: jeff

services:
  jeff:
    image: ghcr.io/ferforastieri/jeff:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: jeff
    restart: unless-stopped
    init: true
    mem_limit: 4g
    ports:
      # Publish on every interface by default so a reverse proxy on another
      # host can reach Jeff. Set JEFF_BIND_ADDRESS=127.0.0.1 for loopback-only.
      - "${JEFF_BIND_ADDRESS:-0.0.0.0}:${JEFF_PORT:-8787}:8787"
    environment:
      JEFF_ADDR: 0.0.0.0:8787
      JEFF_DATA_DIR: /data
      JEFF_WORKSPACES: /workspaces
      # Host owner of the mounted workspace; the entrypoint drops to this
      # UID/GID so the Drive and the agents can write and delete there.
      JEFF_UID: ${JEFF_UID:-1000}
      JEFF_GID: ${JEFF_GID:-1000}
      JEFF_WORKSPACE_GID: ${JEFF_WORKSPACE_GID:-1000}
      JEFF_ADMIN_PASSWORD: ${JEFF_ADMIN_PASSWORD:-}
      JEFF_DATABASE_URL: ${JEFF_DATABASE_URL:-postgres://jeff:jeff@postgres:5432/jeff}
      JEFF_REDIS_URL: ${JEFF_REDIS_URL:-redis://redis:6379}
      JEFF_SECURE_COOKIES: ${JEFF_SECURE_COOKIES:-false}
      JEFF_TRUSTED_PROXIES: ${JEFF_TRUSTED_PROXIES:-}
      JEFF_BUILD_ID: ${JEFF_BUILD_ID:-}
      JEFF_FIREBASE_CREDENTIALS_FILE: ${JEFF_FIREBASE_CREDENTIALS_FILE:-}
      JEFF_FIREBASE_PROJECT_ID: ${JEFF_FIREBASE_PROJECT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jeff-data:/data
      - jeff-home:/home/jeff
      - ${JEFF_WORKSPACES_HOST:-/srv/workspaces}:/workspaces
    security_opt:
      - no-new-privileges:true
    # Match the group that owns the mounted workspace so the container can write.
    group_add:
      - "${JEFF_WORKSPACE_GID:-1000}"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: jeff
      POSTGRES_PASSWORD: jeff
      POSTGRES_DB: jeff
    volumes:
      - jeff-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeff -d jeff"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - jeff-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  jeff-data:
    name: jeff-data
  jeff-home:
    name: jeff-home
  jeff-pgdata:
  jeff-redis:
