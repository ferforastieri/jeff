services:
  postgres:
    image: postgres:16-alpine
    container_name: jeff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jeff
      POSTGRES_PASSWORD: jeff
      POSTGRES_DB: jeff
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jeff-pgdata:/var/lib/postgresql/data
    # Small footprint for a local machine. Raise shared_buffers only if the
    # database grows past a few hundred MB.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=50
      - -c
      - work_mem=8MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeff -d jeff"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: jeff-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - jeff-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  jeff-pgdata:
  jeff-redis:
